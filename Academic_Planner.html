<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Planner | Kamsy Okwu</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header class="site-header"><div class="wrap">
<nav aria-label="Main navigation">
  <a href="Assessments.html">Home</a>
  <a href="About.html">About</a>
  <a href="Projects.html">Projects</a>
  <a href="Academic_Planner.html" aria-current="page">Academic Planner</a>
  <a href="Contact.html">Contact</a>
</nav></div></header>
<main class="wrap">
  <h1>Academic Planner</h1>
  <p class="lead">Keep track of assignments and deadlines. Your tasks are saved in this browser.</p>
  <form id="task-form" class="task-form" novalidate>
    <div class="field grow">
      <label for="task-input">New task</label>
      <input id="task-input" type="text" placeholder="e.g. Finish HTML assignment" aria-describedby="task-error" aria-invalid="false">
    </div>
    <div class="field">
      <label for="task-priority">Priority</label>
      <select id="task-priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <button type="submit">Add task</button>
  </form>
  <p id="task-error" class="error" role="alert"></p>
  <div class="task-controls">
    <div role="group" aria-label="Filter tasks">
      <button type="button" class="task-filter" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="task-filter" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" class="task-filter" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <button type="button" id="clear-done">Clear completed</button>
  </div>
  <p id="task-count" aria-live="polite"></p>
  <ul id="task-list" class="task-list"></ul>
</main>
<footer class="wrap"><p>&copy; <span id="year">2026</span> Kamsy Okwu</p></footer>
</body>
</html>
